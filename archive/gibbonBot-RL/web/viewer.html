<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0b0c">
  <title>scene</title>
  <style>
    :root {
      --bg: #0b0b0c;
      --fg: #ececec;
      --muted: rgba(236,236,236,0.55);
      --pill: rgba(20,20,22,0.78);
      --pill-bd: rgba(255,255,255,0.10);
      --accent: #7dd3fc;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "SF Pro Text", Inter, sans-serif; overflow: hidden; overscroll-behavior: none; touch-action: none; }

    #stage { position: fixed; inset: 0; }
    #stream {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      user-select: none; -webkit-user-drag: none;
      background: #000;
    }

    /* top status pill */
    #top {
      position: fixed; top: calc(8px + var(--safe-t)); left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 6px; align-items: center;
      background: var(--pill); border: 1px solid var(--pill-bd);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-radius: 999px; padding: 4px 6px 4px 12px;
      font-size: 12px; color: var(--muted);
    }
    #top button {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      color: var(--fg);
      width: 28px; height: 28px;
      border-radius: 50%;
      display: grid; place-items: center;
      cursor: pointer; font-size: 13px;
    }
    #top button:active { transform: scale(0.94); }
    #top .dot { width:6px; height:6px; border-radius:50%; background:#22c55e; box-shadow:0 0 6px #22c55e88; }
    #top .dot.paused { background:#fbbf24; box-shadow:0 0 6px #fbbf2488; }

    /* bottom chat bar */
    #bottom {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 8px 10px calc(8px + var(--safe-b));
      display: flex; flex-direction: column; gap: 6px;
      pointer-events: none;
    }
    #log {
      max-height: 30vh; overflow: hidden;
      display: flex; flex-direction: column; gap: 4px;
      padding: 0 4px;
      mask-image: linear-gradient(to bottom, transparent 0, #000 24px);
    }
    #log .msg {
      align-self: flex-start;
      max-width: 80%;
      background: var(--pill); border: 1px solid var(--pill-bd);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      padding: 6px 10px; border-radius: 14px;
      font-size: 13px;
      animation: pop 0.25s ease;
    }
    @keyframes pop { from { opacity:0; transform: translateY(6px) scale(0.96); } }

    #chat {
      pointer-events: auto;
      display: flex; gap: 6px; align-items: center;
      background: var(--pill); border: 1px solid var(--pill-bd);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-radius: 999px; padding: 4px 4px 4px 14px;
    }
    #chat input {
      flex: 1; min-width: 0;
      background: transparent; border: 0; outline: 0;
      color: var(--fg); font: inherit;
      padding: 8px 0;
    }
    #chat input::placeholder { color: var(--muted); }
    #chat button {
      flex: 0 0 auto;
      background: var(--accent); color: #062c3a;
      border: 0; border-radius: 999px;
      width: 36px; height: 36px;
      display: grid; place-items: center;
      font-size: 16px; font-weight: 700;
      cursor: pointer;
    }
    #chat button:disabled { opacity: 0.35; cursor: default; }
    #chat button:active { transform: scale(0.94); }

    /* side pad — pan with finger / mouse */
    #side {
      position: fixed; right: 12px; bottom: calc(72px + var(--safe-b));
      display: flex; flex-direction: column; gap: 8px;
      pointer-events: auto;
    }
    #side button {
      width: 40px; height: 40px;
      background: var(--pill); border: 1px solid var(--pill-bd);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      color: var(--fg); border-radius: 12px;
      display: grid; place-items: center;
      cursor: pointer; font-size: 16px;
    }
    #side button:active { transform: scale(0.94); background: rgba(255,255,255,0.10); }

    /* terrain panel */
    #terrain {
      position: fixed; left: 12px; top: calc(8px + var(--safe-t));
      background: var(--pill); border: 1px solid var(--pill-bd);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-radius: 14px; padding: 10px 12px;
      display: flex; flex-direction: column; gap: 8px;
      min-width: 180px; max-width: 220px;
      font-size: 12px;
    }
    #terrain.collapsed > .row { display: none; }
    #terrain header { display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    #terrain header span:last-child { color: var(--muted); font-size: 11px; }
    #terrain .row { display: flex; flex-direction: column; gap: 3px; }
    #terrain label { display: flex; justify-content: space-between; color: var(--muted); }
    #terrain label b { color: var(--fg); font-weight: 500; }
    #terrain input[type=range] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 18px; background: transparent;
    }
    #terrain input[type=range]::-webkit-slider-runnable-track {
      height: 3px; background: rgba(255,255,255,0.18); border-radius: 2px;
    }
    #terrain input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px; margin-top: -6px;
      border-radius: 50%; background: var(--accent);
    }
    #terrain input[type=range]::-moz-range-track { height: 3px; background: rgba(255,255,255,0.18); border-radius: 2px; }
    #terrain input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--accent); }
    #terrain .status { color: var(--muted); font-size: 11px; min-height: 14px; }
    #terrain .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    #terrain .chip {
      flex: 0 0 auto;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--fg);
      padding: 3px 9px; border-radius: 999px;
      font-size: 11px; cursor: pointer;
      font-family: inherit;
    }
    #terrain .chip:hover { background: rgba(255,255,255,0.12); }
    #terrain .chip.active { background: var(--accent); color: #062c3a; border-color: transparent; }

    /* hint text on first load */
    #hint {
      position: fixed; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      color: var(--muted); font-size: 12px;
      pointer-events: none;
      opacity: 0; transition: opacity 0.4s;
      text-align: center;
    }
    #hint.show { opacity: 1; }

    @media (hover: hover) and (pointer: fine) {
      #side { display: none; }   /* desktop has scroll wheel + right-drag pan */
    }
    @media (max-width: 480px) {
      #log { max-height: 24vh; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <img id="stream" src="/stream" draggable="false" alt="">
  </div>

  <section id="terrain" class="collapsed" aria-label="terrain controls">
    <header onclick="this.parentElement.classList.toggle('collapsed')">
      <strong>terrain</strong><span id="ter-status">tap to edit</span>
    </header>
    <div class="row">
      <label>soil</label>
      <div class="chips" id="soil-chips">
        <button type="button" class="chip" data-preset="loam">loam</button>
        <button type="button" class="chip" data-preset="rocky">rocky</button>
        <button type="button" class="chip" data-preset="sandy">sandy</button>
        <button type="button" class="chip" data-preset="clay">clay</button>
        <button type="button" class="chip" data-preset="terra_rossa">terra rossa</button>
        <button type="button" class="chip" data-preset="limestone">limestone</button>
        <button type="button" class="chip" data-preset="mud">mud</button>
      </div>
    </div>
    <div class="row">
      <label>slope <b><span id="v-slope">15</span>%</b></label>
      <input id="s-slope" type="range" min="0" max="60" step="1" value="15">
    </div>
    <div class="row">
      <label>roughness <b><span id="v-roughness">0.08</span> m</b></label>
      <input id="s-roughness" type="range" min="0" max="0.30" step="0.01" value="0.08">
    </div>
    <div class="row">
      <label>softness <b><span id="v-softness">0.30</span></b></label>
      <input id="s-softness" type="range" min="0" max="1" step="0.05" value="0.30">
    </div>
    <div class="row">
      <label>grip <b><span id="v-grip">0.70</span></b></label>
      <input id="s-grip" type="range" min="0" max="1" step="0.05" value="0.70">
    </div>
    <div class="row">
      <label>sun ° <b><span id="v-sun_elev">60</span></b></label>
      <input id="s-sun_elev" type="range" min="-15" max="90" step="5" value="60">
    </div>
  </section>

  <div id="top" role="toolbar" aria-label="playback">
    <span class="dot" id="led" aria-hidden="true"></span>
    <span id="status">live</span>
    <button id="btn-pause" aria-label="pause">⏸</button>
    <button id="btn-reset" aria-label="reset scene" title="reset">↺</button>
  </div>

  <div id="side" aria-hidden="false">
    <button id="zoom-in"  aria-label="zoom in">＋</button>
    <button id="zoom-out" aria-label="zoom out">−</button>
  </div>

  <div id="bottom">
    <div id="log" aria-live="polite"></div>
    <form id="chat" autocomplete="off">
      <input id="msg" type="text" placeholder="say something…" maxlength="500" enterkeyhint="send" aria-label="message">
      <button type="submit" aria-label="send" id="send">▶</button>
    </form>
  </div>

  <div id="hint" class="show">drag to orbit · pinch / scroll to zoom</div>

  <script>
  // ── state ────────────────────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const stream = $('stream'), btnPause = $('btn-pause'), led = $('led'), statusEl = $('status');
  const log = $('log'), msgIn = $('msg'), chatForm = $('chat'), hint = $('hint');

  let az = 135, el = -25, dist = 3;
  let lookat = [0, 0, 0.5];
  let paused = false;
  let renderedChat = 0;

  // hide hint after 3s or first interaction
  setTimeout(() => hint.classList.remove('show'), 3000);
  ['pointerdown','wheel','keydown'].forEach(t => addEventListener(t, () => hint.classList.remove('show'), { once:true, passive:true }));

  // ── network ──────────────────────────────────────────────────────────────
  const post = (path, body={}) => fetch(path, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body),
  }).catch(()=>{});

  let camPending = false;
  function pushCamera() {                 // coalesce — at most 1 inflight
    if (camPending) return;
    camPending = true;
    post('/camera', { azimuth:az, elevation:el, distance:dist, lookat })
      .finally(() => { camPending = false; });
  }

  // ── controls (orbit + zoom — lookat locked to robot) ────────────────────
  const pointers = new Map();
  let pinchStart = null;

  stream.addEventListener('pointerdown', e => {
    stream.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pointers.size === 2) {
      const pts = [...pointers.values()];
      pinchStart = { d: Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y), distance: dist };
    }
  });

  stream.addEventListener('pointermove', e => {
    const p = pointers.get(e.pointerId); if (!p) return;
    const prev = { x:p.x, y:p.y };
    p.x = e.clientX; p.y = e.clientY;

    if (pointers.size === 1) {
      az += (p.x - prev.x) * 0.4;
      el  = Math.max(-89, Math.min(89, el - (p.y - prev.y) * 0.3));
      pushCamera();
    } else if (pointers.size === 2 && pinchStart) {
      const pts = [...pointers.values()];
      const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      dist = Math.max(0.5, Math.min(20, pinchStart.distance * pinchStart.d / Math.max(1, d)));
      pushCamera();
    }
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStart = null;
  }
  stream.addEventListener('pointerup',     endPointer);
  stream.addEventListener('pointercancel', endPointer);
  stream.addEventListener('pointerleave',  endPointer);

  // wheel zoom (desktop)
  stream.addEventListener('wheel', e => {
    e.preventDefault();
    dist = Math.max(0.5, Math.min(20, dist * (1 + e.deltaY * 0.0012)));
    pushCamera();
  }, { passive:false });

  // side buttons (mobile)
  $('zoom-in') .addEventListener('click', () => { dist = Math.max(0.5, dist * 0.85); pushCamera(); });
  $('zoom-out').addEventListener('click', () => { dist = Math.min(20,  dist * 1.18); pushCamera(); });

  // ── pause / reset ────────────────────────────────────────────────────────
  async function togglePause() {
    const r = await fetch('/pause', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    const s = await r.json();
    paused = s.paused;
    btnPause.textContent = paused ? '▶' : '⏸';
    btnPause.setAttribute('aria-label', paused ? 'play' : 'pause');
    led.classList.toggle('paused', paused);
    statusEl.textContent = paused ? 'paused' : 'live';
  }
  btnPause.addEventListener('click', togglePause);
  $('btn-reset').addEventListener('click', () => post('/reset'));

  // ── robot tracking (always on) ───────────────────────────────────────────
  setInterval(async () => {
    try {
      const s = await (await fetch('/state')).json();
      if (s.torso) { lookat = s.torso.slice(); pushCamera(); }
      if (s.chat && s.chat.length > renderedChat) {
        for (let i = renderedChat; i < s.chat.length; i++) appendMsg(s.chat[i].text);
        renderedChat = s.chat.length;
      }
      if (s.paused !== paused) {
        paused = s.paused;
        btnPause.textContent = paused ? '▶' : '⏸';
        led.classList.toggle('paused', paused);
        statusEl.textContent = paused ? 'paused' : 'live';
      }
      if (s.reload) terStatus.textContent = s.reload === 'idle' ? 'ready' : s.reload;
    } catch (_) {}
  }, 250);

  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === ' ')  { e.preventDefault(); togglePause(); }
    if (e.key === 'r')  { post('/reset'); }
  });

  // ── chat ─────────────────────────────────────────────────────────────────
  chatForm.addEventListener('submit', e => {
    e.preventDefault();
    const text = msgIn.value.trim();
    if (!text) return;
    msgIn.value = '';
    appendMsg(text, true);
    post('/chat', { text });
  });

  function appendMsg(text, mine=false) {
    const el = document.createElement('div');
    el.className = 'msg';
    if (mine) el.style.alignSelf = 'flex-end';
    el.textContent = text;
    log.appendChild(el);
    while (log.children.length > 8) log.removeChild(log.firstChild);
  }

  // ── terrain sliders ──────────────────────────────────────────────────────
  const terStatus = $('ter-status');
  const TER_KEYS = ['slope','roughness','softness','grip','sun_elev'];
  const terState = {};
  let terTimer = null;

  function fmtVal(k, v) {
    if (k === 'slope')     return v.toFixed(0);
    if (k === 'roughness') return v.toFixed(2);
    if (k === 'sun_elev')  return v.toFixed(0);
    return v.toFixed(2);
  }

  function pushTerrain() {
    terStatus.textContent = 'building…';
    fetch('/terrain', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(terState),
    }).catch(()=> { terStatus.textContent = 'error'; });
  }

  // Mediterranean soil presets — values mapped to gen_terrain.py's params
  // (roughness in m, softness/grip 0..1)
  const PRESETS = {
    loam:        { roughness: 0.08, softness: 0.30, grip: 0.70 },   // cultivated grove default (Tuscany / Andalusia)
    rocky:       { roughness: 0.22, softness: 0.05, grip: 0.85 },   // hill country, pebbly + hard
    sandy:       { roughness: 0.04, softness: 0.65, grip: 0.35 },   // coastal Spain / Greek islands
    clay:        { roughness: 0.06, softness: 0.55, grip: 0.45 },   // moist clay, slippery
    terra_rossa: { roughness: 0.10, softness: 0.35, grip: 0.65 },   // Mediterranean red soil
    limestone:   { roughness: 0.18, softness: 0.02, grip: 0.90 },   // bare limestone slabs (Puglia, Crete)
    mud:         { roughness: 0.05, softness: 0.92, grip: 0.22 },   // after rain — deep cushion, very low grip
  };

  document.querySelectorAll('#soil-chips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const p = PRESETS[chip.dataset.preset];
      Object.entries(p).forEach(([k, v]) => {
        const slider = $('s-' + k);
        if (!slider) return;
        slider.value = v;
        terState[k] = v;
        $('v-' + k).textContent = fmtVal(k, v);
      });
      document.querySelectorAll('#soil-chips .chip').forEach(c => c.classList.toggle('active', c === chip));
      clearTimeout(terTimer);
      terTimer = setTimeout(pushTerrain, 200);
    });
  });

  TER_KEYS.forEach(k => {
    const slider = $('s-' + k);
    const label  = $('v-' + k);
    terState[k] = parseFloat(slider.value);
    slider.addEventListener('input', () => {
      const v = parseFloat(slider.value);
      terState[k] = v;
      label.textContent = fmtVal(k, v);
      clearTimeout(terTimer);
      terTimer = setTimeout(pushTerrain, 350);   // debounce
    });
  });

  fetch('/state').then(r => r.json()).then(s => {
    az = s.azimuth; el = s.elevation; dist = s.distance;
    if (s.torso) lookat = s.torso.slice();
    renderedChat = (s.chat || []).length;
  }).catch(()=>{});
  </script>
</body>
</html>
