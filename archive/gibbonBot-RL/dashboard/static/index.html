<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GibbonBot Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
    background: #1a1a2e;
    color: #eaeaea;
    min-height: 100vh;
}
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
header { margin-bottom: 30px; }
h1 { font-size: 2em; color: #eaeaea; }
.subtitle { color: #888; margin-top: 5px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.full-width { grid-column: 1 / -1; }
.card {
    background: #16213e;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #0f3460;
    margin-bottom: 20px;
}
.card h2 { color: #0f3460; margin-bottom: 15px; font-size: 1.2em; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
    padding: 10px 20px;
    background: #0f3460;
    color: #eaeaea;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}
.btn:hover { background: #1a1a2e; }
.btn.primary { background: #e94560; }
.btn.warning { background: #ffc107; color: #000; }
#viewer-container { background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 4/3; }
#viewer-container img { width: 100%; height: 100%; object-fit: contain; background: #111; }
.viewer-controls { display: flex; gap: 10px; margin-top: 10px; justify-content: center; }
#metrics, #logs {
    background: #000; padding: 15px; border-radius: 8px; font-family: Courier New, monospace;
    font-size: 12px; max-height: 400px; overflow-y: auto; white-space: pre-wrap;
}
#logs { max-height: 300px; }
.status-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #0f3460; }
.status-value { color: #e94560; }
.memory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.memory-item { background: #0f3460; padding: 10px; border-radius: 6px; font-size: 12px; }
.loading { color: #888; font-style: italic; }
.error { color: #e94560; }
@media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
<header>
<h1>LIANA</h1>
<p class="subtitle">Live Interactive Ape Neural Architecture</p>
</header>
<div class="grid">
<div class="card">
<h2>Training Controls</h2>
<div class="controls" style="margin-bottom:10px;">
<label>Task:
<select id="task-select" style="padding:6px;border-radius:6px;">
<option value="walk">walk</option>
<option value="stand">stand</option>
<option value="walk_forward">walk_forward</option>
<option value="turn_left">turn_left</option>
<option value="turn_right">turn_right</option>
</select></label>
<label style="margin-left:10px;">Envs:
<input id="envs-input" type="number" min="16" max="4096" step="16" placeholder="auto" style="padding:6px;border-radius:6px;width:90px;"/>
</label>
</div>
<div class="controls">
<button class="btn primary" onclick="startTraining()">Start</button>
<button class="btn warning" onclick="stopTraining()">Stop</button>
<button class="btn" onclick="restartTraining()">Restart (apply task/envs)</button>
<button class="btn" onclick="refreshStatus()">Refresh</button>
</div>
<div class="status-item"><span>Status:</span><span class="status-value" id="status-value">Unknown</span></div>
<div class="status-item"><span>PID:</span><span class="status-value" id="pid-value">-</span></div>
<div class="status-item"><span>Active task:</span><span class="status-value" id="active-task">-</span></div>
<div class="status-item"><span>Active envs:</span><span class="status-value" id="active-envs">-</span></div>
</div>
<div class="card">
<h2>Live Tuning <span style="font-weight:normal;color:#888;font-size:0.7em;">(hot-applied next episode)</span></h2>
<div id="param-sliders"></div>
</div>
<div class="card">
<h2>Brain State</h2>
<div class="controls">
<button class="btn" onclick="loadBrainState()">Load State</button>
<button class="btn" onclick="loadMemory()">Load Memory</button>
<button class="btn" onclick="listModules()">List Modules</button>
</div>
<div id="modules-list"></div>
</div>
</div>
<div class="card full-width">
<h2>MuJoCo Viewer</h2>
<div id="viewer-container"><img id="frame" src="/api/viewer/frame"/></div>
<div class="viewer-controls">
<button class="btn" onclick="refreshFrame()">Refresh Frame</button>
<button class="btn" onclick="getViewerState()">Get State</button>
</div>
<div id="viewer-state" style="margin-top:10px;font-size:12px;"></div>
</div>
<div class="grid">
<div class="card"><h2>Training Metrics</h2><pre id="metrics">Loading...</pre></div>
<div class="card"><h2>Training Logs</h2><div id="logs">Loading...</div></div>
</div>
<div class="grid">
<div class="card"><h2>Recent Memories</h2><div id="memory-container" class="memory-grid"><span class="loading">Loading...</span></div></div>
<div class="card"><h2>System Info</h2><div id="system-info"></div></div>
</div>
</div>
<script>
const API_BASE = window.location.origin + "/api";

function _qs() {
    const task = document.getElementById("task-select").value;
    const envs = document.getElementById("envs-input").value;
    let q = "task=" + encodeURIComponent(task);
    if (envs) q += "&envs=" + encodeURIComponent(envs);
    return q;
}

async function startTraining() {
    try {
        const resp = await fetch(API_BASE + "/train/start?" + _qs(), {method: "POST"});
        const data = await resp.json();
        if (!resp.ok) { alert("Error: " + (data.detail || resp.statusText)); return; }
        refreshStatus();
        loadParams();
    } catch(e) { alert("Error: " + e.message); }
}

async function stopTraining() {
    try {
        const resp = await fetch(API_BASE + "/train/stop", {method: "POST"});
        await resp.json();
        refreshStatus();
    } catch(e) { alert("Error: " + e.message); }
}

async function restartTraining() {
    try {
        const resp = await fetch(API_BASE + "/train/restart?" + _qs(), {method: "POST"});
        const data = await resp.json();
        if (!resp.ok) { alert("Error: " + (data.detail || resp.statusText)); return; }
        refreshStatus();
        loadParams();
    } catch(e) { alert("Error: " + e.message); }
}

async function refreshStatus() {
    try {
        const resp = await fetch(API_BASE + "/train/status");
        const data = await resp.json();
        document.getElementById("status-value").textContent = data.running ? "Running" : "Stopped";
        document.getElementById("status-value").style.color = data.running ? "#28a745" : "#e94560";
        document.getElementById("pid-value").textContent = data.pid || "-";
        document.getElementById("active-task").textContent = data.task || "-";
        document.getElementById("active-envs").textContent = data.envs || "(auto)";
    } catch(e) { console.error("Status error:", e); }
}

async function loadParams() {
    const task = document.getElementById("task-select").value;
    try {
        const resp = await fetch(API_BASE + "/params/get?task=" + encodeURIComponent(task));
        const data = await resp.json();
        if (data.error || !data.params) {
            document.getElementById("param-sliders").innerHTML = "<span class=\"loading\">No params for " + task + "</span>";
            return;
        }
        let html = "";
        for (const [key, val] of Object.entries(data.params)) {
            const [lo, hi] = data.bounds[key];
            const step = (hi - lo) / 200;
            html += "<div style=\"margin:8px 0;\">";
            html += "<label style=\"display:flex;justify-content:space-between;font-size:12px;\"><span>" + key + "</span><span id=\"v-" + key + "\" style=\"color:#e94560;\">" + val.toFixed(3) + "</span></label>";
            html += "<input type=\"range\" min=\"" + lo + "\" max=\"" + hi + "\" step=\"" + step + "\" value=\"" + val + "\" style=\"width:100%;\" oninput=\"document.getElementById('v-" + key + "').textContent=parseFloat(this.value).toFixed(3)\" onchange=\"setParam('" + key + "', this.value)\"/>";
            html += "</div>";
        }
        document.getElementById("param-sliders").innerHTML = html;
    } catch(e) {
        document.getElementById("param-sliders").innerHTML = "<span class=\"error\">Error: " + e.message + "</span>";
    }
}

async function setParam(key, value) {
    const task = document.getElementById("task-select").value;
    try {
        await fetch(API_BASE + "/params/set?task=" + task + "&key=" + key + "&value=" + value, {method: "POST"});
    } catch(e) { console.error("setParam error:", e); }
}

async function listModules() {
    try {
        const resp = await fetch(API_BASE + "/brain/modules");
        const data = await resp.json();
        document.getElementById("modules-list").innerHTML = data.modules.map(function(m) {
            return "<span style="margin-right:10px;">" + m + "</span>";
        }).join("");
    } catch(e) { document.getElementById("modules-list").innerHTML = "<span class="error">Error: " + e.message + "</span>"; }
}

async function loadBrainState() {
    try {
        const resp = await fetch(API_BASE + "/brain/state");
        const data = await resp.json();
        alert("Brain state:
" + JSON.stringify(data.state, null, 2));
    } catch(e) { alert("Error: " + e.message); }
}

async function loadMemory() {
    try {
        const resp = await fetch(API_BASE + "/brain/memory?limit=20");
        const data = await resp.json();
        renderMemory(data.memories);
    } catch(e) { console.error("Memory error:", e); }
}

function renderMemory(memories) {
    var container = document.getElementById("memory-container");
    if (memories.length === 0) {
        container.innerHTML = "<span class="loading">No memories found</span>";
        return;
    }
    var html = "";
    memories.forEach(function(mem) {
        html += "<div class="memory-item">";
        html += "<div><strong>#" + mem.index + "</strong></div>";
        html += "<div>Reward: " + (mem.reward ? mem.reward.toFixed(2) : "N/A") + "</div>";
        html += "<div>Punish: " + (mem.punishment ? mem.punishment.toFixed(2) : "N/A") + "</div>";
        html += "<div>Time: " + (mem.timestamp || "N/A") + "</div>";
        html += "</div>";
    });
    container.innerHTML = html;
}

async function refreshFrame() {
    var frame = document.getElementById("frame");
    frame.src = "/api/viewer/frame?" + Date.now();
}

async function getViewerState() {
    try {
        const resp = await fetch(API_BASE + "/viewer/state");
        const data = await resp.json();
        document.getElementById("viewer-state").innerHTML = "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
    } catch(e) { document.getElementById("viewer-state").innerHTML = "<span class="error">Error: " + e.message + "</span>"; }
}

async function refreshMetrics() {
    try {
        const resp = await fetch(API_BASE + "/train/metrics");
        const data = await resp.json();
        if (data.error) {
            document.getElementById("metrics").textContent = data.error;
        } else {
            document.getElementById("metrics").textContent = JSON.stringify(data, null, 2);
        }
    } catch(e) { document.getElementById("metrics").textContent = "Error: " + e.message; }
}

async function refreshLogs() {
    try {
        const resp = await fetch(API_BASE + "/train/logs?tail=20");
        const data = await resp.json();
        document.getElementById("logs").textContent = data.logs.join("
");
    } catch(e) { document.getElementById("logs").textContent = "Error: " + e.message; }
}

// Auto-refresh
setInterval(refreshFrame, 100);
setInterval(refreshMetrics, 500);
setInterval(refreshLogs, 1000);
setInterval(refreshStatus, 2000);

// Initial load
document.addEventListener("DOMContentLoaded", function() {
    refreshStatus();
    listModules();
    loadMemory();
    refreshMetrics();
    refreshLogs();
    loadParams();
    document.getElementById("task-select").addEventListener("change", loadParams);
});
</script>
</body>
</html>
