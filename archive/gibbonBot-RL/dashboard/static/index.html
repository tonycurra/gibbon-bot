<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIANA</title>
<style>
:root {
    --bg: #000;
    --panel: #0a0a0a;
    --line: #1a1a1a;
    --line-2: #262626;
    --text: #e8e8e8;
    --muted: #6e6e6e;
    --accent: #ff3860;
    --ok: #25d366;
    --warn: #ffb020;
    --pad: clamp(10px, 1.2vw, 18px);
    --gap: clamp(8px, 1vw, 16px);
    --radius: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: clamp(13px, 0.9vw, 14px);
    line-height: 1.4;
    letter-spacing: 0.01em;
}
.container { width: 100%; max-width: 1800px; margin: 0 auto; padding: var(--pad); }
header {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: var(--gap); padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
}
h1 { font-size: 1.3em; font-weight: 600; letter-spacing: 0.18em; }
.subtitle { color: var(--muted); font-size: 0.8em; letter-spacing: 0.04em; }
.northstar { margin-left: auto; color: var(--muted); font-size: 0.8em; font-style: italic; }

.app {
    display: grid; gap: var(--gap);
    grid-template-columns: minmax(0, 1fr);
}
@media (min-width: 1000px) {
    .app { grid-template-columns: minmax(340px, 1fr) minmax(0, 1.8fr); }
}
@media (min-width: 1500px) {
    .app { grid-template-columns: minmax(380px, 1fr) minmax(0, 2.2fr); }
}
.col { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }

.card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: var(--pad);
    min-width: 0;
}
.card h2 {
    font-size: 0.78em;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
}
.card h2 .hint { color: var(--line-2); font-weight: 400; margin-left: 6px; letter-spacing: 0.02em; text-transform: none; font-size: 0.9em; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row + .row { margin-top: 8px; }
label.field { display: inline-flex; flex-direction: column; gap: 4px; font-size: 0.78em; color: var(--muted); }
select, input[type=number], input[type=text] {
    background: #000; color: var(--text);
    border: 1px solid var(--line-2); border-radius: 4px;
    padding: 6px 8px; font-size: 0.95em;
    font-family: inherit;
}
input[type=number] { width: 80px; }
select:focus, input:focus { outline: none; border-color: var(--accent); }

.btn {
    padding: 7px 12px;
    background: #000; color: var(--text);
    border: 1px solid var(--line-2); border-radius: 4px;
    cursor: pointer; font-size: 0.85em;
    font-family: inherit;
    transition: border-color 0.1s, background 0.1s;
}
.btn:hover { border-color: var(--text); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.ghost { color: var(--muted); }
.btn.ghost:hover { color: var(--text); }

.status { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 0.85em; }
.status .k { color: var(--muted); }
.status .v { color: var(--text); font-variant-numeric: tabular-nums; }
.status .v.ok { color: var(--ok); }
.status .v.off { color: var(--muted); }

#viewer-container {
    background: #000; border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden;
    width: 100%; aspect-ratio: 4/3;
    max-height: 75vh;
    display: flex; align-items: center; justify-content: center;
}
#viewer-container img { width: 100%; height: 100%; object-fit: contain; }
.viewer-info { margin-top: 8px; font-size: 0.75em; color: var(--muted); }

#metrics, #logs {
    background: #000; border: 1px solid var(--line);
    padding: 10px; border-radius: 4px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.78em; color: var(--text);
    max-height: 32vh; overflow: auto;
    white-space: pre-wrap; word-break: break-word;
}

.param-row { margin: 6px 0; }
.param-row .lbl { display: flex; justify-content: space-between; font-size: 0.75em; color: var(--muted); margin-bottom: 2px; }
.param-row .val { color: var(--text); font-variant-numeric: tabular-nums; }
.param-row input[type=range] { width: 100%; accent-color: var(--accent); }

/* Joint panel: grouped sliders */
.joint-tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
.joint-tab {
    padding: 5px 10px; font-size: 0.75em; letter-spacing: 0.1em;
    background: #000; border: 1px solid var(--line-2); color: var(--muted);
    border-radius: 4px; cursor: pointer;
}
.joint-tab.active { color: var(--text); border-color: var(--text); }
.joint-row { display: grid; grid-template-columns: 130px 1fr 56px; gap: 8px; align-items: center; padding: 4px 0; font-size: 0.78em; }
.joint-row .jname { color: var(--muted); font-family: ui-monospace, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.joint-row .jval { color: var(--text); font-variant-numeric: tabular-nums; text-align: right; font-family: ui-monospace, Menlo, monospace; }
.joint-row input[type=range] { width: 100%; accent-color: var(--accent); }

.loading { color: var(--muted); font-style: italic; font-size: 0.85em; }
.error { color: var(--accent); }
.divider { height: 1px; background: var(--line); margin: 12px 0; }
</style>
</head>
<body>
<div class="container">

<header>
<h1>LIANA</h1>
<span class="subtitle">Live Interactive Ape Neural Architecture</span>
<span class="northstar">→ demo: walk to the olive tree, on command</span>
</header>

<div class="app">

<!-- LEFT: training controls + tuning + brain -->
<div class="col">

  <div class="card">
    <h2>Training</h2>
    <div class="row">
      <label class="field">Task
        <select id="task-select">
          <option value="walk">walk</option>
          <option value="stand">stand</option>
          <option value="walk_forward">walk_forward</option>
          <option value="turn_left">turn_left</option>
          <option value="turn_right">turn_right</option>
        </select>
      </label>
      <label class="field">Envs
        <input id="envs-input" type="number" min="1" max="4096" step="1" value="1" title="1 = real-time viewing; raise for faster learning"/>
      </label>
    </div>
    <div class="row" style="margin-top:10px;">
      <button class="btn primary" onclick="startTraining()">Start</button>
      <button class="btn" onclick="stopTraining()">Stop</button>
      <button class="btn" onclick="restartTraining()">Restart</button>
      <button class="btn ghost" onclick="refreshStatus()" title="refresh">↻</button>
    </div>
    <div class="divider"></div>
    <div class="status">
      <div class="k">Status</div><div class="v off" id="status-value">—</div>
      <div class="k">PID</div><div class="v" id="pid-value">—</div>
      <div class="k">Active task</div><div class="v" id="active-task">—</div>
      <div class="k">Active envs</div><div class="v" id="active-envs">—</div>
    </div>
  </div>

  <div class="card">
    <h2>Joint Control <span class="hint">drives sim when no training active</span></h2>
    <div class="joint-tabs" id="joint-tabs"></div>
    <div id="joint-sliders"><span class="loading">Loading…</span></div>
    <div class="row" style="margin-top:10px;">
      <button class="btn" onclick="simReset()">Reset Pose</button>
      <button class="btn ghost" onclick="simZero()">Zero Ctrl</button>
    </div>
  </div>

  <div class="card">
    <h2>Live Tuning <span class="hint">applied next episode</span></h2>
    <div id="param-sliders"><span class="loading">Loading…</span></div>
  </div>

</div>

<!-- RIGHT: viewer + metrics + logs -->
<div class="col">

  <div class="card">
    <h2>Viewer</h2>
    <div id="viewer-container"><img id="frame" src="/api/viewer/frame" alt="robot"/></div>
    <div class="viewer-info" id="viewer-info">—</div>
  </div>

  <div class="card"><h2>Metrics</h2><pre id="metrics">—</pre></div>
  <div class="card"><h2>Logs</h2><div id="logs">—</div></div>

</div>

</div>
</div>

<script>
const API = window.location.origin + "/api";

// ── Training ──────────────────────────────────────────────────────────
function _qs() {
    const task = document.getElementById("task-select").value;
    const envs = document.getElementById("envs-input").value;
    let q = "task=" + encodeURIComponent(task);
    if (envs) q += "&envs=" + encodeURIComponent(envs);
    return q;
}
async function startTraining() {
    try {
        const r = await fetch(API + "/train/start?" + _qs(), {method:"POST"});
        const d = await r.json();
        if (!r.ok) { alert("Start failed: " + (d.detail || r.statusText)); return; }
        refreshStatus(); loadParams();
    } catch(e) { alert("Network error: " + e.message); }
}
async function stopTraining() {
    try { await fetch(API + "/train/stop", {method:"POST"}); refreshStatus(); }
    catch(e) { alert(e.message); }
}
async function restartTraining() {
    try {
        const r = await fetch(API + "/train/restart?" + _qs(), {method:"POST"});
        const d = await r.json();
        if (!r.ok) { alert("Restart failed: " + (d.detail || r.statusText)); return; }
        refreshStatus(); loadParams();
    } catch(e) { alert(e.message); }
}
async function refreshStatus() {
    try {
        const r = await fetch(API + "/train/status");
        const d = await r.json();
        const sv = document.getElementById("status-value");
        sv.textContent = d.running ? "RUNNING" : "STOPPED";
        sv.className = "v " + (d.running ? "ok" : "off");
        document.getElementById("pid-value").textContent = d.pid || "—";
        document.getElementById("active-task").textContent = d.task || "—";
        document.getElementById("active-envs").textContent = d.envs || "auto";
    } catch(e) {}
}

// ── Param sliders ─────────────────────────────────────────────────────
async function loadParams() {
    const task = document.getElementById("task-select").value;
    try {
        const r = await fetch(API + "/params/get?task=" + encodeURIComponent(task));
        const d = await r.json();
        if (!d.params) {
            document.getElementById("param-sliders").innerHTML = "<span class=\"loading\">no params for " + task + "</span>";
            return;
        }
        let html = "";
        for (const [k, v] of Object.entries(d.params)) {
            const [lo, hi] = d.bounds[k];
            const step = (hi - lo) / 200;
            html += "<div class=\"param-row\">";
            html += "<div class=\"lbl\"><span>" + k + "</span><span class=\"val\" id=\"pv-" + k + "\">" + v.toFixed(3) + "</span></div>";
            html += "<input type=\"range\" min=\"" + lo + "\" max=\"" + hi + "\" step=\"" + step + "\" value=\"" + v + "\" ";
            html += "oninput=\"document.getElementById('pv-" + k + "').textContent=parseFloat(this.value).toFixed(3)\" ";
            html += "onchange=\"setParam('" + k + "', this.value)\"/>";
            html += "</div>";
        }
        document.getElementById("param-sliders").innerHTML = html;
    } catch(e) {
        document.getElementById("param-sliders").innerHTML = "<span class=\"error\">" + e.message + "</span>";
    }
}
async function setParam(key, value) {
    const task = document.getElementById("task-select").value;
    try { await fetch(API + "/params/set?task=" + task + "&key=" + key + "&value=" + value, {method:"POST"}); }
    catch(e) { console.error(e); }
}

// ── Joint sliders ─────────────────────────────────────────────────────
let JOINTS = [];
let JOINT_GROUP = "FL";
function _group(name) {
    const m = name.match(/^act_([fb][lr])_/);
    return m ? m[1].toUpperCase() : "OTHER";
}
async function loadJoints() {
    try {
        const r = await fetch(API + "/sim/joints");
        const d = await r.json();
        JOINTS = d.actuators || [];
        const groups = Array.from(new Set(JOINTS.map(j => _group(j.name))));
        const tabs = document.getElementById("joint-tabs");
        tabs.innerHTML = groups.map(g =>
            "<button class=\"joint-tab" + (g === JOINT_GROUP ? " active" : "") + "\" onclick=\"selectJointGroup('" + g + "')\">" + g + "</button>"
        ).join("");
        renderJoints();
    } catch(e) {
        document.getElementById("joint-sliders").innerHTML = "<span class=\"error\">" + e.message + "</span>";
    }
}
function selectJointGroup(g) {
    JOINT_GROUP = g;
    document.querySelectorAll(".joint-tab").forEach(el => {
        el.classList.toggle("active", el.textContent === g);
    });
    renderJoints();
}
function renderJoints() {
    const filtered = JOINTS.filter(j => _group(j.name) === JOINT_GROUP);
    const html = filtered.map(j => {
        const step = (j.hi - j.lo) / 200;
        const short = j.name.replace(/^act_/, "");
        return (
            "<div class=\"joint-row\">" +
                "<span class=\"jname\" title=\"" + j.name + "\">" + short + "</span>" +
                "<input type=\"range\" min=\"" + j.lo + "\" max=\"" + j.hi + "\" step=\"" + step + "\" value=\"" + j.ctrl + "\" " +
                    "oninput=\"document.getElementById('jv-" + j.i + "').textContent=parseFloat(this.value).toFixed(2)\" " +
                    "onchange=\"setCtrl(" + j.i + ", this.value)\"/>" +
                "<span class=\"jval\" id=\"jv-" + j.i + "\">" + j.ctrl.toFixed(2) + "</span>" +
            "</div>"
        );
    }).join("");
    document.getElementById("joint-sliders").innerHTML = html || "<span class=\"loading\">no joints in group</span>";
}
async function setCtrl(i, value) {
    try { await fetch(API + "/sim/ctrl?i=" + i + "&value=" + value, {method:"POST"}); }
    catch(e) { console.error(e); }
}
async function simReset() {
    try { await fetch(API + "/sim/reset", {method:"POST"}); loadJoints(); } catch(e) { console.error(e); }
}
async function simZero() {
    try { await fetch(API + "/sim/zero", {method:"POST"}); loadJoints(); } catch(e) { console.error(e); }
}

// ── Viewer / metrics / logs ───────────────────────────────────────────
function refreshFrame() {
    document.getElementById("frame").src = "/api/viewer/frame?" + Date.now();
}
async function refreshMetrics() {
    try {
        const r = await fetch(API + "/train/metrics");
        const d = await r.json();
        const el = document.getElementById("metrics");
        if (d.error) { el.textContent = d.error; }
        else { el.textContent = Object.entries(d).map(([k,v]) => k.padEnd(12) + " " + v).join("\n"); }
    } catch(e) { document.getElementById("metrics").textContent = e.message; }
}
async function refreshLogs() {
    try {
        const r = await fetch(API + "/train/logs?tail=20");
        const d = await r.json();
        document.getElementById("logs").textContent = (d.logs || []).join("");
    } catch(e) {}
}

// ── Boot ──────────────────────────────────────────────────────────────
setInterval(refreshFrame, 100);
setInterval(refreshMetrics, 500);
setInterval(refreshLogs, 1000);
setInterval(refreshStatus, 2000);
document.addEventListener("DOMContentLoaded", () => {
    refreshStatus();
    loadParams();
    loadJoints();
    refreshMetrics();
    refreshLogs();
    document.getElementById("task-select").addEventListener("change", loadParams);
});
</script>
</body>
</html>
