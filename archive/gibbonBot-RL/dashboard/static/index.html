<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GibbonBot Dashboard</title>
<style>
:root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --border: #0f3460;
    --text: #eaeaea;
    --muted: #888;
    --accent: #e94560;
    --ok: #28a745;
    --warn: #ffc107;
    --gap: clamp(8px, 1.2vw, 20px);
    --pad: clamp(10px, 1.4vw, 20px);
    --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
    font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: clamp(13px, 0.95vw, 15px);
    line-height: 1.4;
}
.container {
    width: 100%;
    max-width: 1800px;
    margin: 0 auto;
    padding: var(--pad);
}
header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: var(--gap);
}
h1 { font-size: clamp(1.4em, 2.4vw, 2em); color: var(--text); letter-spacing: 0.05em; }
.subtitle { color: var(--muted); font-size: 0.85em; }

/* Two-column app layout: viewer dominant on the left, controls stack on right.
   Auto-collapses to single column when there's no horizontal room. */
.app {
    display: grid;
    gap: var(--gap);
    grid-template-columns: minmax(0, 1fr);
}
@media (min-width: 1000px) {
    .app { grid-template-columns: minmax(0, 2.1fr) minmax(320px, 1fr); }
}
@media (min-width: 1500px) {
    .app { grid-template-columns: minmax(0, 2.4fr) minmax(360px, 1fr); }
}

.col { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }

.card {
    background: var(--panel);
    border-radius: var(--radius);
    padding: var(--pad);
    border: 1px solid var(--border);
    min-width: 0;
}
.card h2 {
    color: var(--text);
    margin-bottom: 12px;
    font-size: 1em;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
}
.card h2 .hint { color: var(--muted); font-weight: 400; font-size: 0.75em; text-transform: none; letter-spacing: 0; margin-left: 6px; }

/* Two-up grid that collapses on small panes */
.two-up { display: grid; gap: var(--gap); grid-template-columns: 1fr; }
@media (min-width: 700px) { .two-up { grid-template-columns: 1fr 1fr; } }

.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.controls label { display: inline-flex; align-items: center; gap: 6px; font-size: 0.9em; color: var(--muted); }
.controls select, .controls input[type=number], .controls input[type=text] {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 0.9em;
    min-width: 0;
}
.controls input[type=number] { width: 90px; }

.btn {
    padding: 8px 14px;
    background: var(--border);
    color: var(--text);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9em;
    transition: filter 0.1s;
}
.btn:hover { filter: brightness(1.2); }
.btn.primary { background: var(--accent); }
.btn.warning { background: var(--warn); color: #000; }

/* Viewer — fills its column, capped so it never pushes everything else off-screen */
#viewer-container {
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    width: 100%;
    aspect-ratio: 4/3;
    max-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
#viewer-container img { width: 100%; height: 100%; object-fit: contain; }
.viewer-controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

/* Mono blocks */
#metrics, #logs {
    background: #000;
    padding: 12px;
    border-radius: 8px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.8em;
    max-height: 38vh;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
}

.status-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.9em; }
.status-item:last-child { border-bottom: 0; }
.status-value { color: var(--accent); font-variant-numeric: tabular-nums; }

.memory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.memory-item { background: var(--border); padding: 8px; border-radius: 6px; font-size: 0.8em; }

.loading { color: var(--muted); font-style: italic; }
.error { color: var(--accent); }

/* Slider rows */
.param-row { margin: 6px 0; }
.param-row label { display: flex; justify-content: space-between; font-size: 0.8em; color: var(--muted); }
.param-row .val { color: var(--accent); font-variant-numeric: tabular-nums; }
.param-row input[type=range] { width: 100%; accent-color: var(--accent); }
</style>
</head>
<body>
<div class="container">
<header>
<h1>LIANA</h1>
<span class="subtitle">Live Interactive Ape Neural Architecture</span>
</header>

<div class="app">
  <!-- Left column: viewer + telemetry -->
  <div class="col">
    <div class="card">
      <h2>Viewer <span class="hint">env-0 qpos, refreshed each PPO batch</span></h2>
      <div id="viewer-container"><img id="frame" src="/api/viewer/frame" alt="robot"/></div>
      <div class="viewer-controls">
        <button class="btn" onclick="refreshFrame()">Refresh Frame</button>
        <button class="btn" onclick="getViewerState()">Get State</button>
      </div>
      <div id="viewer-state" style="margin-top:10px;font-size:0.8em;color:var(--muted);"></div>
    </div>

    <div class="two-up">
      <div class="card"><h2>Metrics</h2><pre id="metrics">Loading...</pre></div>
      <div class="card"><h2>Logs</h2><div id="logs">Loading...</div></div>
    </div>
  </div>

  <!-- Right column: controls + brain -->
  <div class="col">
    <div class="card">
      <h2>Training</h2>
      <div class="controls" style="margin-bottom:10px;">
        <label>Task
          <select id="task-select">
            <option value="walk">walk</option>
            <option value="stand">stand</option>
            <option value="walk_forward">walk_forward</option>
            <option value="turn_left">turn_left</option>
            <option value="turn_right">turn_right</option>
          </select>
        </label>
        <label>Envs
          <input id="envs-input" type="number" min="16" max="4096" step="16" placeholder="auto"/>
        </label>
      </div>
      <div class="controls" style="margin-bottom:12px;">
        <button class="btn primary" onclick="startTraining()">Start</button>
        <button class="btn warning" onclick="stopTraining()">Stop</button>
        <button class="btn" onclick="restartTraining()">Restart</button>
        <button class="btn" onclick="refreshStatus()">↻</button>
      </div>
      <div class="status-item"><span>Status</span><span class="status-value" id="status-value">Unknown</span></div>
      <div class="status-item"><span>PID</span><span class="status-value" id="pid-value">-</span></div>
      <div class="status-item"><span>Active task</span><span class="status-value" id="active-task">-</span></div>
      <div class="status-item"><span>Active envs</span><span class="status-value" id="active-envs">-</span></div>
    </div>

    <div class="card">
      <h2>Live Tuning <span class="hint">applied next episode</span></h2>
      <div id="param-sliders"></div>
    </div>

    <div class="card">
      <h2>Brain</h2>
      <div class="controls">
        <button class="btn" onclick="loadBrainState()">State</button>
        <button class="btn" onclick="loadMemory()">Memory</button>
        <button class="btn" onclick="listModules()">Modules</button>
      </div>
      <div id="modules-list" style="margin-top:8px;font-size:0.85em;color:var(--muted);"></div>
      <div id="memory-container" class="memory-grid" style="margin-top:10px;"><span class="loading">Memory not loaded</span></div>
    </div>
  </div>
</div>
</div>
<script>
const API_BASE = window.location.origin + "/api";

function _qs() {
    const task = document.getElementById("task-select").value;
    const envs = document.getElementById("envs-input").value;
    let q = "task=" + encodeURIComponent(task);
    if (envs) q += "&envs=" + encodeURIComponent(envs);
    return q;
}

async function startTraining() {
    try {
        const resp = await fetch(API_BASE + "/train/start?" + _qs(), {method: "POST"});
        const data = await resp.json();
        if (!resp.ok) { alert("Error: " + (data.detail || resp.statusText)); return; }
        refreshStatus();
        loadParams();
    } catch(e) { alert("Error: " + e.message); }
}

async function stopTraining() {
    try {
        const resp = await fetch(API_BASE + "/train/stop", {method: "POST"});
        await resp.json();
        refreshStatus();
    } catch(e) { alert("Error: " + e.message); }
}

async function restartTraining() {
    try {
        const resp = await fetch(API_BASE + "/train/restart?" + _qs(), {method: "POST"});
        const data = await resp.json();
        if (!resp.ok) { alert("Error: " + (data.detail || resp.statusText)); return; }
        refreshStatus();
        loadParams();
    } catch(e) { alert("Error: " + e.message); }
}

async function refreshStatus() {
    try {
        const resp = await fetch(API_BASE + "/train/status");
        const data = await resp.json();
        document.getElementById("status-value").textContent = data.running ? "Running" : "Stopped";
        document.getElementById("status-value").style.color = data.running ? "#28a745" : "#e94560";
        document.getElementById("pid-value").textContent = data.pid || "-";
        document.getElementById("active-task").textContent = data.task || "-";
        document.getElementById("active-envs").textContent = data.envs || "(auto)";
    } catch(e) { console.error("Status error:", e); }
}

async function loadParams() {
    const task = document.getElementById("task-select").value;
    try {
        const resp = await fetch(API_BASE + "/params/get?task=" + encodeURIComponent(task));
        const data = await resp.json();
        if (data.error || !data.params) {
            document.getElementById("param-sliders").innerHTML = "<span class=\"loading\">No params for " + task + "</span>";
            return;
        }
        let html = "";
        for (const [key, val] of Object.entries(data.params)) {
            const [lo, hi] = data.bounds[key];
            const step = (hi - lo) / 200;
            html += "<div class=\"param-row\">";
            html += "<label><span>" + key + "</span><span class=\"val\" id=\"v-" + key + "\">" + val.toFixed(3) + "</span></label>";
            html += "<input type=\"range\" min=\"" + lo + "\" max=\"" + hi + "\" step=\"" + step + "\" value=\"" + val + "\" oninput=\"document.getElementById('v-" + key + "').textContent=parseFloat(this.value).toFixed(3)\" onchange=\"setParam('" + key + "', this.value)\"/>";
            html += "</div>";
        }
        document.getElementById("param-sliders").innerHTML = html;
    } catch(e) {
        document.getElementById("param-sliders").innerHTML = "<span class=\"error\">Error: " + e.message + "</span>";
    }
}

async function setParam(key, value) {
    const task = document.getElementById("task-select").value;
    try {
        await fetch(API_BASE + "/params/set?task=" + task + "&key=" + key + "&value=" + value, {method: "POST"});
    } catch(e) { console.error("setParam error:", e); }
}

async function listModules() {
    try {
        const resp = await fetch(API_BASE + "/brain/modules");
        const data = await resp.json();
        document.getElementById("modules-list").innerHTML = data.modules.map(function(m) {
            return "<span style="margin-right:10px;">" + m + "</span>";
        }).join("");
    } catch(e) { document.getElementById("modules-list").innerHTML = "<span class="error">Error: " + e.message + "</span>"; }
}

async function loadBrainState() {
    try {
        const resp = await fetch(API_BASE + "/brain/state");
        const data = await resp.json();
        alert("Brain state:
" + JSON.stringify(data.state, null, 2));
    } catch(e) { alert("Error: " + e.message); }
}

async function loadMemory() {
    try {
        const resp = await fetch(API_BASE + "/brain/memory?limit=20");
        const data = await resp.json();
        renderMemory(data.memories);
    } catch(e) { console.error("Memory error:", e); }
}

function renderMemory(memories) {
    var container = document.getElementById("memory-container");
    if (memories.length === 0) {
        container.innerHTML = "<span class="loading">No memories found</span>";
        return;
    }
    var html = "";
    memories.forEach(function(mem) {
        html += "<div class="memory-item">";
        html += "<div><strong>#" + mem.index + "</strong></div>";
        html += "<div>Reward: " + (mem.reward ? mem.reward.toFixed(2) : "N/A") + "</div>";
        html += "<div>Punish: " + (mem.punishment ? mem.punishment.toFixed(2) : "N/A") + "</div>";
        html += "<div>Time: " + (mem.timestamp || "N/A") + "</div>";
        html += "</div>";
    });
    container.innerHTML = html;
}

async function refreshFrame() {
    var frame = document.getElementById("frame");
    frame.src = "/api/viewer/frame?" + Date.now();
}

async function getViewerState() {
    try {
        const resp = await fetch(API_BASE + "/viewer/state");
        const data = await resp.json();
        document.getElementById("viewer-state").innerHTML = "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
    } catch(e) { document.getElementById("viewer-state").innerHTML = "<span class="error">Error: " + e.message + "</span>"; }
}

async function refreshMetrics() {
    try {
        const resp = await fetch(API_BASE + "/train/metrics");
        const data = await resp.json();
        if (data.error) {
            document.getElementById("metrics").textContent = data.error;
        } else {
            document.getElementById("metrics").textContent = JSON.stringify(data, null, 2);
        }
    } catch(e) { document.getElementById("metrics").textContent = "Error: " + e.message; }
}

async function refreshLogs() {
    try {
        const resp = await fetch(API_BASE + "/train/logs?tail=20");
        const data = await resp.json();
        document.getElementById("logs").textContent = data.logs.join("
");
    } catch(e) { document.getElementById("logs").textContent = "Error: " + e.message; }
}

// Auto-refresh
setInterval(refreshFrame, 100);
setInterval(refreshMetrics, 500);
setInterval(refreshLogs, 1000);
setInterval(refreshStatus, 2000);

// Initial load
document.addEventListener("DOMContentLoaded", function() {
    refreshStatus();
    listModules();
    loadMemory();
    refreshMetrics();
    refreshLogs();
    loadParams();
    document.getElementById("task-select").addEventListener("change", loadParams);
});
</script>
</body>
</html>
