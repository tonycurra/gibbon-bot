<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>gibbon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="console.css">
</head>
<body>
<header>
  <span id="dot" class="dot off"></span>
  <strong>gibbon</strong>
  <span id="link" class="bad">offline</span>
  <span class="sp"></span>
  <button type="button" id="btnHost">connect</button>
  <button type="button" id="btnBle" hidden>ble</button>
  <button type="button" id="btnUsb" hidden>usb</button>
  <button type="button" id="btnDisc" hidden>drop</button>
  <button type="button" class="stop" id="btnStop" hidden>STOP</button>
</header>
<section id="meta"></section>
<p id="hint">waiting for chip.</p>
<div id="armWrap">
<table>
  <thead>
    <tr>
      <th>joint</th>
      <th>id</th>
      <th>pos<b>56</b></th>
      <th>un</th>
      <th>turns</th>
      <th>spd<b>58</b></th>
      <th>load<b>60</b></th>
      <th>V<b>62</b></th>
      <th>°C<b>63</b></th>
      <th>mA<b>69</b></th>
      <th>mv<b>66</b></th>
      <th>tq<b>40</b></th>
      <th>mode<b>33</b></th>
      <th>st<b>65</b></th>
      <th>fw<b>0</b></th>
      <th>motor</th>
    </tr>
  </thead>
  <tbody id="armBody"></tbody>
</table>
</div>
<div id="acts"></div>
<pre id="log"></pre>
<script src="console.js?v=9"></script>
</body>
</html>
