{% extends "console/base.html" %}
{% load static %}
{% block main %}
<p class="nowline">
  <b id="degNow">—</b>
  <span>load <i id="loadLive">—</i></span>
  <span>mA <i id="curLive">—</i></span>
  {% if joint.paired %}<span>12 <i id="load-12">—</i> / 13 <i id="load-13">—</i></span>{% endif %}
</p>
{% if joint.paired %}
<p class="row act" id="pairBar">
  <button type="button" id="btnPairMirror">mirror −</button>
  <button type="button" id="btnPairSame">same +</button>
  <b id="pairState">unset</b>
</p>
{% endif %}
<div class="lims">
  <button type="button" id="btnZero">{% if joint.slug == "hand" %}closed = 0°{% else %}0°{% endif %}</button>
  <label>{% if joint.slug == "hand" %}closed{% else %}min{% endif %}
    <input id="inMin" type="number" step="0.1">
    <button type="button" id="btnMarkMin">mark</button>
  </label>
  <label>{% if joint.slug == "hand" %}open{% else %}max{% endif %}
    <input id="inMax" type="number" step="0.1">
    <button type="button" id="btnMarkMax">mark</button>
  </label>
  <label>go
    <input id="inGo" type="number" step="0.5">
    <button type="button" id="btnGo">go</button>
  </label>
  <button type="button" class="go" id="btnTest">test</button>
  {% if next_joint %}
  <a class="nextJ" href="/calibration/{{ next_joint.slug }}/">next {{ next_joint.name }}</a>
  {% endif %}
</div>
<p id="calMsg" class="hint next"></p>
{% endblock %}
{% block js %}
<script>window.JOINT_SLUG = "{{ joint.slug }}";</script>
<script src="{% static 'console/js/calibrate.js' %}"></script>
{% endblock %}
