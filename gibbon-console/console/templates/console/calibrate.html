{% extends "console/base.html" %}
{% load static %}
{% block main %}
<table class="ov calIdx">
  <thead>
    <tr><th>joint</th><th>now</th><th>load</th><th>mA</th><th>min</th><th>max</th></tr>
  </thead>
  <tbody>
    {% for j in cal_rows %}
    <tr id="row-{{ j.slug }}">
      <td><a href="/calibration/{{ j.slug }}/">{{ j.name }}</a></td>
      <td id="now-{{ j.slug }}">—</td>
      <td id="load-{{ j.slug }}">—</td>
      <td id="cur-{{ j.slug }}">—</td>
      <td id="min-{{ j.slug }}">—</td>
      <td id="max-{{ j.slug }}">—</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
{% block js %}
<script src="{% static 'console/js/calibrate.js' %}"></script>
{% endblock %}
