<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>gibbon / {{ crumb }}</title>
{% load static %}
<link rel="icon" href="{% static 'console/icon.svg' %}">
<link rel="stylesheet" href="{% static 'console/app.css' %}">
</head>
<body>
<header class="bar">
  <span id="dot" class="dot off"></span>
  <a class="brand" href="/">gibbon</a>
  <span id="link" class="bad">offline</span>
  <span id="packEl">pack —</span>
  <span id="foundEl" class="mut">motors —</span>
  <span id="tqEl" class="mut">tq off</span>
  <a id="trialChip" href="/trials/"></a>
  <span class="sp"></span>
  <button type="button" id="btnHost">connect</button>
  <button type="button" id="btnDisc" hidden>drop</button>
  <button type="button" class="stop" id="btnStop">STOP</button>
</header>
<nav>
  {% for key, label in pages %}
  <a href="{% url key %}"{% if page == key %} class="on"{% endif %}>{{ label }}</a>
  {% endfor %}
</nav>
<main>
{% block main %}{% endblock %}
</main>
<footer class="foot">
  <button type="button" id="footToggle">log</button>
  <pre id="footLog">—</pre>
</footer>
<script>window.CATALOG = {{ catalog_json }};</script>
<script src="{% static 'console/js/core.js' %}"></script>
{% block js %}{% endblock %}
</body>
</html>
